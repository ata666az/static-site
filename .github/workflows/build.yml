name: Build & Deploy Static VPN

on:
  schedule:
    - cron: '0 */6 * * *'   # tiap 6 jam
  workflow_dispatch:          # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data
        run: node build.js

      - name: Commit generated data (opsional)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: rebuild data [skip ci]"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: static-vpn-proxy
          directory: public
