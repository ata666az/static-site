<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090A0F">
  <title>Static VPN — Proxy Directory</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app">
    <div class="backdrop"></div>

    <header class="topbar glass">
      <div class="identity">
        <div class="identity-mark">VPN</div>
        <div>
          <h1>Static <span>Proxy Directory</span></h1>
          <p>ZERO FUNCTION · ZERO LIMIT</p>
        </div>
      </div>
      <div class="system-meta" id="systemMeta">
        <div class="meta-chip"><span>Loading…</span></div>
      </div>
    </header>

    <section class="page-heading">
      <div>
        <p class="eyebrow">PROXY DIRECTORY / STATIC BUILD</p>
        <h2 id="title">Memuat…</h2>
      </div>
      <div class="page-info" id="pageInfo"></div>
    </section>

    <section class="toolbar glass">
      <input id="search" type="text" placeholder="Cari negara, IP, organisasi…">
      <select id="countryFilter">
        <option value="">Semua negara</option>
      </select>
      <select id="protocolFilter">
        <option value="">Semua protokol</option>
        <option value="trojan">Trojan</option>
        <option value="vless">VLESS</option>
        <option value="ss">Shadowsocks</option>
      </select>
      <button id="copyAllBtn">Copy Semua</button>
      <a id="downloadSubBtn" href="/data/sub.txt" download>Download .txt</a>
    </section>

    <section class="proxy-grid" id="proxyGrid">
      <div class="proxy-card glass" style="grid-column:1/-1;text-align:center;padding:40px">
        <div style="color:var(--muted);font:12px 'JetBrains Mono'">Memuat data…</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"><span>✓</span><span>Tersalin</span></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
